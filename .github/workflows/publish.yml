name: Sync and build calendar feed

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "config/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

concurrency:
  group: "build-calendar"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # build.mjs derives DTSTAMP from the last commit touching data/ and
          # config/; a shallow clone can't see it and the feed would rebuild
          # (and commit) on every run.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync release sources
        run: npm run sync -- --no-git

      - name: Build feed
        run: npm run build

      - name: Commit synchronized calendar
        run: |
          if [ -n "$(git status --porcelain data docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data docs
            git commit -m "Sync release calendar"
            git push
          fi
